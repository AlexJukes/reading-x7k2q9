<title>Halloween Mystery (prototype)</title>
<style>html,body{margin:0;height:100%;background:#120a1f;overflow:hidden}canvas{display:block;margin:0 auto;background:#120a1f}</style>
</head><body><canvas id="c" width="1100" height="680"></canvas>
<script>
(function(){
'use strict';
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var CW=1100,CH=680,TW=64,TH=32;
function fit(){var s=Math.min(window.innerWidth/CW,window.innerHeight/CH);cv.style.width=(CW*s)+'px';cv.style.height=(CH*s)+'px';}
window.addEventListener('resize',fit);fit();

/* ---------- audio (tiny beeps, no files) ---------- */
var AC=null;
function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,vol,slide){var a=audio();if(!a)return;try{var o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,a.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),a.currentTime+d);g.gain.setValueAtTime(vol||0.08,a.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d);}catch(e){}}
var sfx={roar:function(){tone(180,0.6,'sawtooth',0.12,50);tone(120,0.6,'square',0.08,40);},hover:function(){tone(400,0.25,'sine',0.07,800);},land:function(){tone(500,0.2,'sine',0.07,250);},rocket:function(){tone(120,0.5,'sawtooth',0.08,600);},clue:function(){tone(660,0.12,'triangle',0.1);setTimeout(function(){tone(880,0.2,'triangle',0.1);},120);},bad:function(){tone(200,0.2,'square',0.06,120);},boo:function(){tone(300,0.4,'sine',0.1,900);},sw:function(){tone(520,0.08,'square',0.05);}};

/* ---------- map ---------- */
var W=26,H=22;
var T={GRASS:0,PATH:1,HOUSE:2,TREE:3,PUMPKIN:4,FENCE:5,VOID:6,MOON:7,GATE:8,GRAVE:9,TOMB:10};
var map=[];
function setT(x,y,t){if(x>=0&&y>=0&&x<W&&y<H)map[y][x]=t;}
function buildMap(){
 var x,y;map=[];
 for(y=0;y<H;y++){map[y]=[];for(x=0;x<W;x++)map[y][x]=T.GRASS;}
 for(x=1;x<=15;x++){setT(x,10,T.PATH);setT(x,11,T.PATH);}
 for(y=2;y<=20;y++)setT(8,y,T.PATH);
 [[2,3,3,2],[11,3,3,2],[2,14,3,3],[11,14,3,2]].forEach(function(h){for(var yy=0;yy<h[3];yy++)for(var xx=0;xx<h[2];xx++)setT(h[0]+xx,h[1]+yy,T.HOUSE);});
 [[6,2],[7,5],[10,7],[1,8],[14,9],[6,12],[10,12],[1,19],[7,19],[14,19],[12,8],[9,16],[15,5],[15,13]].forEach(function(t){setT(t[0],t[1],T.TREE);});
 [[4,8],[5,8],[13,6],[14,6],[5,18],[6,18]].forEach(function(t){setT(t[0],t[1],T.PUMPKIN);});
 for(x=1;x<=6;x++)setT(x,13,T.FENCE);
 for(y=12;y<=21;y++)setT(16,y,T.FENCE);
 setT(16,16,T.GATE);setT(16,17,T.GATE);
 for(y=12;y<=21;y++)for(x=17;x<W;x++)setT(x,y,T.GRAVE);
 [[18,13],[20,13],[24,13],[18,20],[23,20],[25,15],[17,18],[25,19],[19,15]].forEach(function(t){setT(t[0],t[1],T.TOMB);});
 for(y=0;y<=11;y++){setT(16,y,T.VOID);setT(17,y,T.VOID);}
 for(y=10;y<=11;y++)for(x=18;x<W;x++)setT(x,y,T.VOID);
 for(y=0;y<=9;y++)for(x=18;x<W;x++)setT(x,y,T.MOON);
}
function tileAt(x,y){var tx=Math.floor(x),ty=Math.floor(y);if(tx<0||ty<0||tx>=W||ty>=H)return -1;return map[ty][tx];}
function hash(x,y){var n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n);}

/* ---------- state ---------- */
var S={mode:'title',t:0,msg:'',msgT:0,shake:0,winPage:0,sceneClue:null,sceneMsg:'',mx:0,my:0};
var kids=[],clues=[],boss=null,orbs=[],rings=[],parts=[];
var players=[{kid:0,col:'#ffd23f',name:'P1'},{kid:-1,col:'#4cc9f0',name:'P2'}];
var gateOpen=false,bossDone=false,cam={x:0,y:0};

function mkKids(){return [
 {n:'Boo',type:'ghost',col:'#ffffff',acc:'#ff9ad5',x:7.5,y:9.5},
 {n:'Wisp',type:'ghost',col:'#e4f2ff',acc:'#7fd1ff',x:8.5,y:9.5},
 {n:'Mist',type:'ghost',col:'#f3e8ff',acc:'#c59bff',x:9.5,y:9.5},
 {n:'Nova',type:'astro',col:'#f4f4f8',acc:'#ff8a3d',x:7.5,y:12.5},
 {n:'Comet',type:'astro',col:'#f4f4f8',acc:'#9b6bff',x:9.5,y:12.5},
 {n:'Stompy',type:'dino',col:'#5cc760',acc:'#ff8a3d',x:8.5,y:12.5}
 ].map(function(k,i){k.i=i;k.z=0;k.zt=0;k.state='walk';k.fuel=5;k.cd=0;k.dizzy=0;k.seed=i*1.7;return k;});}

function sc(title,bg,floor,items){return {title:title,bg:bg,floor:floor,items:items};}
function mkClues(){return [
 {id:'A1',kind:'air',x:3.5,y:4.0,z:56,sc:sc('On the rooftop',['#2a1b57','#6a3fa0'],'#3b2a63',[
   {e:'🧱',x:330,y:400,clue:1,msg:'The chimney is covered in fine grey STONE DUST. Somebody has been breaking rocks!'},
   {e:'🦇',x:640,y:250,msg:'The bat yawns. Not helpful.'},{e:'🌙',x:880,y:230,msg:'A very pretty moon.'},{e:'🪟',x:600,y:410,msg:'A dark attic window. Nobody home.'}])},
 {id:'A2',kind:'air',x:12.5,y:4.0,z:56,sc:sc('In the treetop',['#14304a','#2f6b6b'],'#2b4a3a',[
   {e:'✉️',x:420,y:380,clue:1,msg:'A note: "SHHH! NO MORE HALLOWEEN NOISE!" in very neat, square handwriting.'},
   {e:'🐦‍⬛',x:760,y:260,msg:'Caw!'},{e:'🍂',x:260,y:260,msg:'Just leaves.'},{e:'🪹',x:640,y:420,msg:'An empty nest. Very quiet.'}])},
 {id:'A3',kind:'air',x:7.5,y:19.5,z:56,sc:sc('Up with the bats',['#341a4a','#7a3a6a'],'#46285a',[
   {e:'🏷️',x:520,y:380,clue:1,msg:'A key tag: "MUSEUM CARETAKER. Property of the Town Museum."'},
   {e:'🦇',x:300,y:260,msg:'Squeak! (It says hello.)'},{e:'🕸️',x:850,y:240,msg:'A cobweb. Ew, sticky.'},{e:'🎈',x:700,y:300,msg:'A lost balloon. Poor thing.'}])},
 {id:'G1',kind:'ground',x:4.5,y:8.5,z:10,hidden:1,sc:sc('The pumpkin patch',['#3a1f3d','#7a4a2a'],'#3f6a3a',[
   {e:'👣',x:480,y:400,clue:1,msg:'A GIANT boot print with a pebble pattern on the sole. Size 11, square toes.'},
   {e:'🎃',x:250,y:350,msg:'A grinning pumpkin. It will not talk.'},{e:'🐌',x:760,y:430,msg:'A snail. Slow, but a good listener.'},{e:'🌱',x:880,y:330,msg:'Just a little sprout.'}])},
 {id:'G2',kind:'ground',x:13.5,y:6.5,z:10,hidden:1,sc:sc('Under the big pumpkin',['#2f1a3a','#6a3a2a'],'#4a6a3a',[
   {e:'🍬',x:520,y:400,clue:1,msg:'A sack of STOLEN CANDY, dusted with stone crumbs!'},
   {e:'🎃',x:290,y:340,msg:'Another pumpkin. Same grin.'},{e:'🪱',x:760,y:440,msg:'A worm waves hello.'},{e:'🪨',x:860,y:330,msg:'Just a rock. Probably.'}])},
 {id:'G3',kind:'ground',x:5.5,y:18.5,z:10,hidden:1,sc:sc('By the old wheelbarrow',['#222a4a','#4a5a6a'],'#3a5a3a',[
   {e:'🧾',x:450,y:410,clue:1,msg:'A receipt: "One rock polisher. Signed: MR PEBBLE."'},
   {e:'🪣',x:700,y:400,msg:'An empty bucket.'},{e:'🔨',x:270,y:330,msg:'A hammer. Hmm, a bit suspicious.'},{e:'🪨',x:880,y:320,msg:'A very shiny rock.'}])},
 {id:'M1',kind:'moon',x:20.5,y:3.5,z:12,sc:sc('A moon crater',['#05051a','#2a2a55'],'#8a90a8',[
   {e:'🏮',x:520,y:390,clue:1,msg:'EVERY missing lantern, stacked in the crater! Tag: "Property of the Town Museum."'},
   {e:'⭐',x:260,y:250,msg:'A star. It twinkles at you.'},{e:'🕳️',x:760,y:430,msg:'A deep, dark hole.'},{e:'🪨',x:880,y:300,msg:'Moon rock. Not cheese.'}])},
 {id:'M2',kind:'moon',x:23.5,y:7.5,z:12,sc:sc('The moon telescope',['#05051a','#33305f'],'#8a90a8',[
   {e:'📜',x:520,y:400,clue:1,msg:'A plan: "Crumble the graveyard wall into a stone creature at midnight. QUIET at last! - P."'},
   {e:'🔭',x:260,y:330,msg:'You can see your house from here. Hi, house!'},{e:'🧀',x:760,y:430,msg:'Is it cheese? ...No. Just a pale rock.'},{e:'🛰️',x:880,y:250,msg:'A satellite beeps at you.'}])}
 ].map(function(c){c.found=false;c.revealed=!c.hidden;c.shake=0;c.cool=0;return c;});}

function mkBoss(){var s=[];for(var i=0;i<6;i++)s.push({a:i*Math.PI/3,state:0,t:0});return {x:21.5,y:17.5,stones:s,fire:3};}
function initGame(){initGame0();v2Init();}
function initGame0(){buildMap();kids=mkKids();clues=mkClues();boss=mkBoss();orbs=[];rings=[];parts=[];gateOpen=false;bossDone=false;players[0].kid=0;players[1].kid=-1;S.msg='';S.msgT=0;S.shake=0;cam.x=0;cam.y=0;camSnap();}
function stonePos(s){return {x:boss.x+Math.cos(s.a)*2.6,y:boss.y+Math.sin(s.a)*2.6};}
function say(m,d){S.msg=m;S.msgT=d||3.5;speak(m);}
function dist(ax,ay,bx,by){return Math.hypot(ax-bx,ay-by);}
function foundCount(){return clues.filter(function(c){return c.found;}).length;}

/* ---------- movement ---------- */
function standable(k,x,y,state){
 var t=tileAt(x,y);if(t<0)return false;
 if(t===T.GATE)return gateOpen;
 if(state==='rocket')return true;
 if(t===T.VOID)return false;
 if(!bossDone&&gateOpen&&dist(x,y,boss.x,boss.y)<1.3)return false;
 if(state==='hover')return true;
 return !(t===T.HOUSE||t===T.TREE||t===T.FENCE||t===T.TOMB);
}
function canStand(k,x,y,state){state=state||k.state;var r=0.22;return standable(k,x-r,y-r,state)&&standable(k,x+r,y-r,state)&&standable(k,x-r,y+r,state)&&standable(k,x+r,y+r,state);}
function ownerOf(i){return players[0].kid===i?0:(players[1].kid===i?1:-1);}
function otherKid(pi){var o=players[1-pi].kid;return o>=0?kids[o]:null;}
function moveKid(pi,ix,iy,dt){
 var k=kids[players[pi].kid];if(!k||k.dizzy>0)return;
 if(!ix&&!iy)return;
 var gx=ix+iy,gy=iy-ix,l=Math.hypot(gx,gy);gx/=l;gy/=l;
 var sp=k.state==='rocket'?5.2:(k.state==='hover'?3.0:3.4);
 var nx=k.x+gx*sp*dt,ny=k.y+gy*sp*dt,o=otherKid(pi),LEASH=9;
 if(canStand(k,nx,k.y)){if(!(o&&dist(nx,k.y,o.x,o.y)>LEASH&&dist(nx,k.y,o.x,o.y)>dist(k.x,k.y,o.x,o.y)))k.x=nx;}
 if(canStand(k,k.x,ny)){if(!(o&&dist(k.x,ny,o.x,o.y)>LEASH&&dist(k.x,ny,o.x,o.y)>dist(k.x,k.y,o.x,o.y)))k.y=ny;}
}
function tryLand(k){
 if(canStand(k,k.x,k.y,'walk')){k.state='walk';k.zt=0;sfx.land();return true;}
 say(k.state==='rocket'?'Nowhere to land here! Fly somewhere flat.':'You cannot land here. Float somewhere flat.',2.5);sfx.bad();return false;
}
function power(pi){
 if(S.mode!=='play')return;
 var k=kids[players[pi].kid];if(!k||k.dizzy>0)return;
 if(k.type==='ghost'){if(k.state==='walk'){k.state='hover';k.zt=46;sfx.hover();}else if(k.state==='hover')tryLand(k);}
 else if(k.type==='astro'){if(k.state==='walk'){k.state='rocket';k.zt=70;k.fuel=5;sfx.rocket();}else if(k.state==='rocket')tryLand(k);}
 else roar(k);
}
function roar(k){var cd0=k.cd;roar0(k);if(k.cd>cd0)v2Roar(k);}
function roar0(k){
 if(k.cd>0)return;k.cd=1.2;rings.push({x:k.x,y:k.y,t:0});sfx.roar();S.shake=0.35;
 var got=false;
 clues.forEach(function(c){if(c.kind==='ground'&&!c.found&&!c.revealed&&dist(c.x,c.y,k.x,k.y)<=4.5){c.revealed=true;c.shake=0.9;got=true;}});
 if(got)say('Something fell out of the pumpkins!',3);
 if(gateOpen&&!bossDone){var cr=false;boss.stones.forEach(function(s){var p=stonePos(s);if(s.state!==2&&dist(p.x,p.y,k.x,k.y)<=5){s.state=1;s.t=9;cr=true;}});
  if(cr)say('CRACK! A ghost is inside. Only a ghost-kid can pop it!',3.5);
  orbs=orbs.filter(function(o){return dist(o.x,o.y,k.x,k.y)>3;});}
}
function switchKid(pi){
 if(S.mode!=='play'||players[pi].kid<0)return;
 var cur=kids[players[pi].kid];
 if(cur.state==='rocket'&&tileAt(cur.x,cur.y)===T.VOID){say('Land the rocket first!',2);sfx.bad();return;}
 if(cur.state!=='walk'&&canStand(cur,cur.x,cur.y,'walk')){cur.state='walk';cur.zt=0;}
 var n=players[pi].kid,i;
 for(i=1;i<=6;i++){var c=(n+i)%6;if(ownerOf(c)===-1){players[pi].kid=c;players[pi].target=null;sfx.sw();v2Say(kids[c]);return;}}
}
function toggleP2(){
 if(S.mode!=='play')return;
 if(players[1].kid>=0){var k=kids[players[1].kid];if(k.state!=='walk'&&canStand(k,k.x,k.y,'walk')){k.state='walk';k.zt=0;}players[1].kid=-1;say('Player 2 left.',1.5);return;}
 for(var i=0;i<6;i++){if(ownerOf(i)===-1){players[1].kid=i;say('Player 2 joined! Arrows to move, slash for power. Press Tab to swap keys.',5);sfx.sw();return;}}
}

/* ---------- update ---------- */
function camTarget(){
 var a=kids[players[0].kid],b=players[1].kid>=0?kids[players[1].kid]:a;
 var cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;return {x:(cx-cy)*TW/2,y:(cx+cy)*TH/2-25};
}
function camSnap(){var t=camTarget();cam.x=t.x;cam.y=t.y;}
function update0(dt){
 S.t+=dt;if(S.msgT>0)S.msgT-=dt;if(S.shake>0)S.shake-=dt;
 if(S.mode!=='play')return;
 var i;
 var v0=schemeIn(0);
 moveKid(0,v0.ix,v0.iy,dt);
 if(players[1].kid>=0){var v1=schemeIn(1);moveKid(1,v1.ix,v1.iy,dt);}
 kids.forEach(function(k){
  if(k.z<k.zt)k.z=Math.min(k.zt,k.z+200*dt);else if(k.z>k.zt)k.z=Math.max(k.zt,k.z-200*dt);
  if(k.cd>0)k.cd-=dt;if(k.dizzy>0)k.dizzy-=dt;
  if(k.state==='rocket'&&ownerOf(k.i)>=0){k.fuel-=dt;if(k.fuel<=0){
    if(canStand(k,k.x,k.y,'walk')){k.state='walk';k.zt=0;say('Out of fuel! Rocket landed.',2.5);}
    else{k.state='walk';k.zt=0;k.x=14.5;k.y=10.5;k.z=0;say('Out of fuel! Whoosh, back to town.',3);}sfx.bad();}}
  if(k.state==='walk'&&k.fuel<5)k.fuel=Math.min(5,k.fuel+dt*1.5);
 });
 players.forEach(function(p,pi){
  if(p.kid<0)return;var k=kids[p.kid];
  clues.forEach(function(c){
   if(c.found||!c.revealed||c.cool>0)return;
   if(dist(c.x,c.y,k.x,k.y)>0.75)return;
   if(c.kind==='air'){if(!(k.type==='ghost'&&k.state==='hover'))return;}
   else if(k.state!=='walk')return;
   startScene(c);
  });
 });
 clues.forEach(function(c){if(c.cool>0)c.cool-=dt;if(c.shake>0)c.shake-=dt;});
 rings.forEach(function(r){r.t+=dt;});rings=rings.filter(function(r){return r.t<0.6;});
 parts.forEach(function(p){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.vz-=120*dt;});parts=parts.filter(function(p){return p.life>0;});
 bossUpdate(dt);
 var t=camTarget();cam.x+=(t.x-cam.x)*Math.min(1,5*dt);cam.y+=(t.y-cam.y)*Math.min(1,5*dt);
}
function burst(x,y,z,col,n){for(var i=0;i<n;i++)parts.push({x:x,y:y,z:z,vx:(Math.random()-.5)*2,vy:(Math.random()-.5)*2,vz:40+Math.random()*80,life:0.8,col:col});}
function bossUpdate(dt){
 if(!gateOpen||bossDone)return;
 boss.stones.forEach(function(s){
  if(s.state===2)return;
  s.a+=dt*(s.state===1?0.2:0.55);
  if(s.state===1){s.t-=dt;if(s.t<=0)s.state=0;
   var p=stonePos(s);
   kids.forEach(function(k){if(s.state===1&&k.type==='ghost'&&k.state==='hover'&&dist(k.x,k.y,p.x,p.y)<0.95){s.state=2;sfx.boo();burst(p.x,p.y,46,'#ffffff',14);var left=boss.stones.filter(function(q){return q.state!==2;}).length;say(left?('Boo! A ghost is free! '+left+' to go.'):'The last ghost is free!',2.5);}});}
 });
 if(boss.stones.every(function(s){return s.state===2;})){bossDone=true;S.mode='win';S.winPage=0;sfx.clue();return;}
 boss.fire-=dt*(boss.stones.filter(function(q){return q.state!==2;}).length<=3?1.4:1);
 if(boss.fire<=0){boss.fire=3;
  var near=null,nd=11;players.forEach(function(p){if(p.kid<0)return;var k=kids[p.kid],d=dist(k.x,k.y,boss.x,boss.y);if(d<nd){nd=d;near=k;}});
  if(near){var dx=near.x-boss.x,dy=near.y-boss.y,l=Math.hypot(dx,dy)||1;orbs.push({x:boss.x,y:boss.y,vx:dx/l*2.3,vy:dy/l*2.3,life:6});if(boss.stones.filter(function(q){return q.state!==2;}).length<=3){[-0.4,0.4].forEach(function(a){var ca=Math.cos(a),sa=Math.sin(a);orbs.push({x:boss.x,y:boss.y,vx:(dx*ca-dy*sa)/l*2.1,vy:(dx*sa+dy*ca)/l*2.1,life:6});});v2Taunt();}}}
 orbs.forEach(function(o){o.x+=o.vx*dt;o.y+=o.vy*dt;o.life-=dt;
  players.forEach(function(p){if(p.kid<0)return;var k=kids[p.kid];if(o.life>0&&k.dizzy<=0&&dist(o.x,o.y,k.x,k.y)<0.5){k.dizzy=1.2;o.life=0;sfx.bad();}});});
 orbs=orbs.filter(function(o){return o.life>0;});
}

/* ---------- scenes (point and click) ---------- */
function startScene(c){S.mode='scene';S.sceneClue=c;S.sceneMsg='';sfx.sw();speak(c.sc.title+'. Click on things to find the clue!');}
function leaveScene(){
 var c=S.sceneClue;c.cool=2;S.mode='play';S.sceneClue=null;
 if(c.found){
  burst(c.x,c.y,20,'#ffd23f',10);
  if(foundCount()===clues.length&&!gateOpen){gateOpen=true;say('All 8 clues! The graveyard gate creaks open... something is rumbling.',6);}
  else say('Clues: '+foundCount()+' / '+clues.length,2.5);
 }
}
function sceneClick(mx,my){
 var c=S.sceneClue,items=c.sc.items,hit=null;
 if(mx>440&&mx<660&&my>606&&my<656){leaveScene();return;}
 items.forEach(function(it){if(dist(mx,my,it.x,it.y)<62)hit=it;});
 if(hit){S.sceneMsg=hit.msg;speak(hit.msg+(hit.clue&&!c.found?' You found a clue!':''));if(hit.clue&&!c.found){c.found=true;sfx.clue();}else if(!hit.clue){tone(300,0.1,'triangle',0.05);hopClue(c);}}
}

/* ---------- drawing helpers ---------- */
function proj(x,y,z){return [(x-y)*TW/2-cam.x+CW/2,(x+y)*TH/2-(z||0)-cam.y+CH/2];}
function paint(col,line){ctx.fillStyle=col;ctx.fill();if(line!==false){ctx.lineWidth=line||3;ctx.strokeStyle='#14101e';ctx.lineJoin='round';ctx.stroke();}}

function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);}
function ell(x,y,rx,ry){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);}
function poly(pts){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(var i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath();}

function diamond(x,y,col,z){var a=proj(x,y,z),b=proj(x+1,y,z),c=proj(x+1,y+1,z),d=proj(x,y+1,z);poly([a,b,c,d]);ctx.fillStyle=col;ctx.fill();}
function lerp2(A,B,u){return [A[0]+(B[0]-A[0])*u,A[1]+(B[1]-A[1])*u];}
function bil(P,u,v){var top=lerp2(P[0],P[1],u),bot=lerp2(P[3],P[2],u);return lerp2(top,bot,v);}
function box(x,y,h,top,left,right,line){
 var p1=proj(x+1,y,0),p2=proj(x+1,y+1,0),p3=proj(x,y+1,0),t0=proj(x,y,h),t1=proj(x+1,y,h),t2=proj(x+1,y+1,h),t3=proj(x,y+1,h);

 else if(t===T.GRAVE||t===T.TOMB)col=alt?'#5a4a6e':'#54446a';

var voiceOn=true,lastSpoken='',voiceObj=null,winKey=-1,winPg=null;

 var en=vs.filter(function(v){return /^en/i.test(v.lang);});if(!en.length)return null;

 var gb=(nice.length?nice:en).filter(function(v){return /en[-_]GB/i.test(v.lang);});

}

 if(s===1||s===-1){ix+=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0);iy+=(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0);}
 ix=Math.max(-1,Math.min(1,ix));iy=Math.max(-1,Math.min(1,iy));

 if(noTarget||!p.target||p.kid<0)return {ix:0,iy:0};
