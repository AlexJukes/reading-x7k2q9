<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Reading</title>
<style>
:root{--bg:#fafaf7;--fg:#1d1d1b;--mut:#6b6b66;--card:#fff;--bd:#e6e4dc;--ac:#2f5d50}
@media(prefers-color-scheme:dark){:root{--bg:#161615;--fg:#ececE6;--mut:#9a9a92;--card:#1f1f1d;--bd:#2d2d2a;--ac:#7fb8a6}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 -apple-system,system-ui,Segoe UI,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 2px}
.sub{color:var(--mut);font-size:13px;margin-bottom:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
input[type=search]{flex:1;min-width:140px;padding:9px 11px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);font-size:15px}
button{border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.card a.t{color:var(--fg);font-weight:600;text-decoration:none;display:block}
.card a.t:hover{text-decoration:underline}
.meta{color:var(--mut);font-size:12.5px;margin:2px 0 6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ac);margin-right:6px}
.sn{color:var(--mut);font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.chip{font-size:13px;padding:5px 10px;border-radius:999px}.sec{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ac);margin:18px 0 8px;display:flex;justify-content:space-between}.sec span{color:var(--mut);font-weight:500}
.msg{padding:24px;text-align:center;color:var(--mut)}
small a,.lnk{color:var(--ac);cursor:pointer;text-decoration:underline;background:none;border:0;padding:0;font-size:inherit}
</style>
</head>
<body>
<div class="wrap">
<h1>Reading</h1>
<div class="sub" id="sub">Loading…</div>
<div class="bar">
<input type="search" id="q" placeholder="Search title, sender, summary">
<button id="tab-new" class="on">Last 30 days</button>
<button id="tab-old">Archive</button>
<button id="refresh">Refresh</button>
</div>
<div class="chips" id="chips"></div>
<div id="list"></div>
<p class="sub"><button class="lnk" id="sync">Set up Done sync to Gmail</button></p>
</div>
<script>
(function(){
var REPO='AlexJukes/reading-x7k2q9';
var DAYS30=30*24*3600*1000;
var $=function(id){return document.getElementById(id)};
var ORDER=["Professional","Society & Politics","Culture & Arts","Mind & Wellbeing","Other","Notifications"];var items=[],updated=null,tab='new',cat='all';
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
function b64d(s){s=s.replace(/-/g,'+').replace(/_/g,'/');var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function getDone(){try{return JSON.parse(ls('done')||'{}')}catch(e){return {}}}
function setDone(d){ls('done',JSON.stringify(d))}
(function takeKey(){
 var m=location.hash.match(/k=([A-Za-z0-9_-]+)/);
 if(m){ls('rk',m[1]);history.replaceState(null,'',location.pathname+location.search)}
})();
async function load(){
 var key=ls('rk');
 if(!key){$('sub').textContent='Open your private link once to unlock this page.';$('list').innerHTML='';return}
 $('sub').textContent='Loading…';
 try{
  var r=await fetch('data.enc.json?t='+Date.now(),{cache:'no-store'});
  if(!r.ok)throw new Error('data '+r.status);
  var j=await r.json();
  var k=await crypto.subtle.importKey('raw',b64d(key),'AES-GCM',false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(j.iv.replace(/\+/g,'-').replace(/\//g,'_'))},k,b64d(j.ct.replace(/\+/g,'-').replace(/\//g,'_')));
  items=JSON.parse(new TextDecoder().decode(pt));updated=j.updated;
  var d=getDone(),live={};items.forEach(function(x){live[x.i]=1});
  Object.keys(d).forEach(function(i){if(!live[i])delete d[i]});setDone(d);
  render();
 }catch(e){$('sub').textContent='Could not load or unlock: '+e.message;}
}
function ago(ts){var s=(Date.now()-ts)/1000;if(s<90)return 'just now';if(s<5400)return Math.round(s/60)+' min ago';if(s<172800)return Math.round(s/3600)+' h ago';return Math.round(s/86400)+' days ago'}
function fmt(ts){return new Date(ts).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}
function card(x){
 var c=document.createElement('div');c.className='card';
 var a=document.createElement('a');a.className='t';a.target='_blank';a.rel='noopener noreferrer';
 a.href=x.l||('https://mail.google.com/mail/u/0/#all/'+x.t);a.textContent=x.s;
 var m=document.createElement('div');m.className='meta';
 if(x.u){var dt=document.createElement('span');dt.className='dot';m.appendChild(dt)}
 m.appendChild(document.createTextNode(x.f+' · '+fmt(x.d)+(x.l?'':' · opens Gmail')));
 var s=document.createElement('div');s.className='sn';s.textContent=x.n;
 var row=document.createElement('div');row.className='row';
 var b=document.createElement('button');b.textContent='Done';b.onclick=function(){markDone(x.i)};
 row.appendChild(b);
 c.appendChild(a);c.appendChild(m);c.appendChild(s);c.appendChild(row);return c;
}
function render(){
 var q=$('q').value.trim().toLowerCase(),done=getDone(),now=Date.now();
 var base=items.filter(function(x){
  if(done[x.i])return false;
  var recent=now-x.d<DAYS30;
  if(tab==='new'&&!recent)return false;
  if(tab==='old'&&recent)return false;
  if(q&&(x.s+' '+x.f+' '+x.n).toLowerCase().indexOf(q)<0)return false;
  return true});
 var nNew=items.filter(function(x){return !done[x.i]&&now-x.d<DAYS30}).length;
 var nOld=items.filter(function(x){return !done[x.i]&&now-x.d>=DAYS30}).length;
 $('tab-new').textContent='Last 30 days ('+nNew+')';$('tab-old').textContent='Archive ('+nOld+')';
 $('sub').textContent='Updated '+ago(Date.parse(updated))+(ls('ghtoken')?' · Done syncs to Gmail':' · Done hides here only');
 var counts={};base.forEach(function(x){counts[x.c]=(counts[x.c]||0)+1});
 var chips=$('chips');chips.innerHTML='';
 function chip(key,label,n){var b=document.createElement('button');b.className='chip'+(cat===key?' on':'');b.textContent=label+' ('+n+')';b.onclick=function(){cat=key;render()};chips.appendChild(b)}
 chip('all','All',base.length);
 ORDER.forEach(function(c){if(counts[c])chip(c,c,counts[c])});
 var list=$('list');list.innerHTML='';
 var vis=cat==='all'?base:base.filter(function(x){return x.c===cat});
 if(!vis.length){var e=document.createElement('div');e.className='msg';e.textContent=q?'No matches.':'Nothing here. Nice.';list.appendChild(e);return}
 var shown=0,LIMIT=300;
 var groups=cat==='all'?ORDER:[cat];
 groups.forEach(function(g){
  var gi=vis.filter(function(x){return x.c===g});
  if(!gi.length||shown>=LIMIT)return;
  if(cat==='all'){var h=document.createElement('div');h.className='sec';h.innerHTML='<b></b><span></span>';h.firstChild.textContent=g;h.lastChild.textContent=gi.length+' item'+(gi.length===1?'':'s');list.appendChild(h)}
  gi.slice(0,LIMIT-shown).forEach(function(x){list.appendChild(card(x));shown++});
 });
}

async function markDone(id){
 var d=getDone();d[id]=1;setDone(d);render();
 var tok=ls('ghtoken');
 if(tok){
  try{await fetch('https://api.github.com/repos/'+REPO+'/contents/done/'+id,{method:'PUT',headers:{'Authorization':'Bearer '+tok,'Accept':'application/vnd.github+json'},body:JSON.stringify({message:'done '+id,content:btoa('x')})})}catch(e){}
 }
}
$('q').addEventListener('input',render);
$('tab-new').onclick=function(){tab='new';$('tab-new').className='on';$('tab-old').className='';render()};
$('tab-old').onclick=function(){tab='old';$('tab-old').className='on';$('tab-new').className='';render()};
$('refresh').onclick=load;
$('sync').onclick=function(){
 var t=prompt('Paste a fine-grained GitHub token limited to '+REPO+' (Contents: read and write). Leave empty to turn sync off.');
 if(t===null)return;ls('ghtoken',t.trim()||null);render();
};
load();
})();
</script>
</body>
</html>
